name: Discovery Lab CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: railway
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: railway/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        run: pytest -q

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check canonical frontend JavaScript
        run: find frontend -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Syntax check Railway static JavaScript
        run: find railway/app/static -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Syntax check Netlify API function
        run: node --check frontend/netlify/functions/api.mjs
