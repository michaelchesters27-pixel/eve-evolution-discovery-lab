name: Patch Live Trader stale feed

on:
  push:
    branches:
      - agent/live-trader-stale-feed-watchdog
    paths:
      - .github/workflows/patch-stale-feed.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-trader-stale-feed-watchdog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch backend and frontend
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('railway/app/services/live_trader.py')
          s = p.read_text()

          old = '''    def runtime_status(self) -> dict[str, Any]:\n        return {\n            "version": LIVE_TRADER_VERSION,\n            "enabled": self.settings.live_trader_enabled,\n            "symbol": self.symbol,\n            "connected": self.connected,\n            "last_tick_at": self.last_tick_at,\n'''
          new = '''    def _tick_age_seconds(self) -> float | None:\n        if not self.last_tick_at:\n            return None\n        try:\n            stamp = datetime.fromisoformat(self.last_tick_at.replace("Z", "+00:00"))\n        except (TypeError, ValueError):\n            return None\n        if stamp.tzinfo is None:\n            stamp = stamp.replace(tzinfo=timezone.utc)\n        return max(0.0, (utc_now() - stamp.astimezone(timezone.utc)).total_seconds())\n\n    def _feed_is_fresh(self, max_age_seconds: float = 30.0) -> bool:\n        age = self._tick_age_seconds()\n        return bool(self.connected and age is not None and age <= max_age_seconds)\n\n    def runtime_status(self) -> dict[str, Any]:\n        tick_age = self._tick_age_seconds()\n        return {\n            "version": LIVE_TRADER_VERSION,\n            "enabled": self.settings.live_trader_enabled,\n            "symbol": self.symbol,\n            "connected": self._feed_is_fresh(),\n            "socket_connected": self.connected,\n            "tick_age_seconds": round(tick_age, 1) if tick_age is not None else None,\n            "last_tick_at": self.last_tick_at,\n'''
          if old not in s:
              raise SystemExit('runtime_status anchor not found')
          s = s.replace(old, new, 1)

          old = '''        state: dict[str, Any] = {\n            "version": LIVE_TRADER_VERSION,\n            "symbol": self.symbol,\n            "price": round(price, 3),\n            "as_of": self.last_tick_at or latest.get("candle_time") or iso_now(),\n            "feed": {\n                "status": "live" if self.connected else "waiting_for_api_key" if not self.settings.twelve_data_api_key else "reconnecting",\n                "provider": "Twelve Data WebSocket",\n                "connected": self.connected,\n                "last_tick_at": self.last_tick_at,\n                "api_key_configured": bool(self.settings.twelve_data_api_key),\n                "messages_received": self.messages_received,\n            },\n'''
          new = '''        feed_fresh = self._feed_is_fresh()\n        tick_age = self._tick_age_seconds()\n        state: dict[str, Any] = {\n            "version": LIVE_TRADER_VERSION,\n            "symbol": self.symbol,\n            "price": round(price, 3),\n            "as_of": self.last_tick_at or latest.get("candle_time") or iso_now(),\n            "feed": {\n                "status": "live" if feed_fresh else "waiting_for_api_key" if not self.settings.twelve_data_api_key else "stale" if self.connected else "reconnecting",\n                "provider": "Twelve Data WebSocket",\n                "connected": feed_fresh,\n                "socket_connected": self.connected,\n                "tick_age_seconds": round(tick_age, 1) if tick_age is not None else None,\n                "last_tick_at": self.last_tick_at,\n                "api_key_configured": bool(self.settings.twelve_data_api_key),\n                "messages_received": self.messages_received,\n            },\n'''
          if old not in s:
              raise SystemExit('refresh_state anchor not found')
          s = s.replace(old, new, 1)

          old = '''                    try:\n                        async for message in websocket:\n                            if self._stop.is_set():\n                                break\n                            try:\n                                payload = json.loads(message)\n                            except (TypeError, json.JSONDecodeError):\n                                continue\n                            if isinstance(payload, dict):\n                                await self._handle_price(payload)\n                    finally:\n'''
          new = '''                    connected_at = utc_now()\n                    try:\n                        while not self._stop.is_set():\n                            try:\n                                message = await asyncio.wait_for(websocket.recv(), timeout=15)\n                            except asyncio.TimeoutError:\n                                age = self._tick_age_seconds()\n                                if (utc_now() - connected_at) >= timedelta(seconds=30) and (age is None or age > 30):\n                                    raise RuntimeError(f"stale Twelve Data price feed: no fresh tick for {age if age is not None else 'unknown'} seconds")\n                                continue\n                            try:\n                                payload = json.loads(message)\n                            except (TypeError, json.JSONDecodeError):\n                                continue\n                            if isinstance(payload, dict):\n                                await self._handle_price(payload)\n                            age = self._tick_age_seconds()\n                            if (utc_now() - connected_at) >= timedelta(seconds=30) and age is not None and age > 30:\n                                raise RuntimeError(f"stale Twelve Data price feed: last price tick is {age:.1f} seconds old")\n                    finally:\n'''
          if old not in s:
              raise SystemExit('websocket loop anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          f = Path('frontend/live_trader.js')
          js = f.read_text()
          old = '''    const feedEl = byId('ltFeed');\n    feedEl.className = `lt-feed ${feed.connected ? 'live' : ''}`;\n    feedEl.querySelector('b').textContent = feed.connected ? 'LIVE' : feed.api_key_configured ? 'RECONNECTING' : 'API KEY NEEDED';\n'''
          new = '''    const feedEl = byId('ltFeed');\n    feedEl.className = `lt-feed ${feed.connected ? 'live' : ''}`;\n    const feedStatus = String(feed.status || '').toLowerCase();\n    feedEl.querySelector('b').textContent = feed.connected ? 'LIVE' : feedStatus === 'stale' ? 'STALE — RECONNECTING' : feed.api_key_configured ? 'RECONNECTING' : 'API KEY NEEDED';\n'''
          if old not in js:
              raise SystemExit('frontend feed anchor not found')
          js = js.replace(old, new, 1)
          f.write_text(js)
          PY
      - name: Install test dependencies
        run: pip install -r railway/requirements.txt
      - name: Run Live Trader tests
        run: PYTHONPATH=railway pytest -q railway/tests/test_live_trader.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add railway/app/services/live_trader.py frontend/live_trader.js
          git commit -m "Harden Live Trader against stale websocket ticks"
          git push origin HEAD:agent/live-trader-stale-feed-watchdog
